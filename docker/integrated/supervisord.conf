[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/integrated-supervisor.pid
user=root
[unix_http_server]
file=/tmp/integrated-supervisor.sock
chmod=0700
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///tmp/integrated-supervisor.sock
[program:picpeak]
directory=/app
command=/app/wait-for-db.sh node --max-http-header-size=32768 server.js
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:bridge]
command=/opt/integrated/bridge.sh
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
