[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pixcake-bridge"
version = "0.1.5"
description = "PicPeak proofing to NAS RAW and PixCake final delivery bridge"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "httpx==0.28.1", "sqlalchemy==2.0.41", "watchfiles==1.0.5", "jinja2==3.1.6", "python-multipart==0.0.20"]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "pillow==11.2.1"]
postgres = ["psycopg[binary]==3.2.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
