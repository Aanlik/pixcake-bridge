name: pixcake
services:
  picpeak:
    image: ${STACK_IMAGE:-picpeak-pixcake:3.134.1-zh.11-bridge.0.1.2}
    build:
      context: .
      dockerfile: Dockerfile.integrated
      args:
        PICPEAK_BASE: ${PICPEAK_BASE:-picpeak-zh:3.134.1-zh.11}
    # Copy only configuration into the service volume to support NAS owner-only bind permissions.
    entrypoint:
    - dumb-init
    - --
    - /bin/sh
    - -ec
    - cp /config/projects.json /bridge-data/projects.json; chown 1001:1001 /bridge-data/projects.json; chmod 640 /bridge-data/projects.json; exec /opt/integrated/start.sh
    environment:
      PORT: '3000'
      NO_EMAIL_MODE: 'true'
      PIXCAKE_BRIDGE_URL: http://127.0.0.1:8080
      PIXCAKE_BRIDGE_PASSWORD: ${BRIDGE_ADMIN_PASSWORD:?填写管理密码}
      DATABASE_CLIENT: sqlite3
      EXTERNAL_MEDIA_ROOT: /external-media
      EXTERNAL_MEDIA_WATCH_POLLING: 'true'
      EXTERNAL_MEDIA_WATCH_SWEEP_INTERVAL_MS: '60000'
      TZ: Asia/Shanghai
      PICPEAK_URL: http://127.0.0.1:3000
      PICPEAK_TOKEN: ${PICPEAK_TOKEN:-}
      BRIDGE_ADMIN_PASSWORD: ${BRIDGE_ADMIN_PASSWORD:?填写管理密码}
      DATABASE_URL: sqlite:////bridge-data/bridge.db
      PROJECTS_FILE: /bridge-data/projects.json
      POLL_SECONDS: ${POLL_SECONDS:-30}
      STABLE_SECONDS: ${STABLE_SECONDS:-10}
      MAX_FINAL_BYTES: ${MAX_FINAL_BYTES:-104857600}
      HISTORY_KEEP: ${HISTORY_KEEP:-3}
      RAW_MATERIALIZE_MODE: ${RAW_MATERIALIZE_MODE:-auto}
      WATCHFILES_FORCE_POLLING: 'true'
      BRIDGE_ENABLED: ${BRIDGE_ENABLED:-false}
    ports:
    - ${LAN_BIND_IP:-127.0.0.1}:${PICPEAK_PORT:-3000}:3000
    - ${LAN_BIND_IP:-127.0.0.1}:${BRIDGE_PORT:-8080}:8080
    volumes:
    - picpeak-data:/data
    - type: bind
      source: ${PHOTO_PROJECT:?填写摄影项目绝对路径}/02_PROOF
      target: /external-media/${PROJECT_FOLDER:-示例项目}
      read_only: true
      bind:
        create_host_path: false
    - bridge-data:/bridge-data
    - ./projects.json:/config/projects.json:ro
    - type: bind
      source: ${PHOTO_PROJECT}/01_RAW
      target: /raw/${PROJECT_FOLDER:-示例项目}
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${PHOTO_PROJECT}/03_SELECTED_RAW
      target: /selected/${PROJECT_FOLDER:-示例项目}
      bind:
        create_host_path: false
    - type: bind
      source: ${PHOTO_PROJECT}/04_FINAL
      target: /final/${PROJECT_FOLDER:-示例项目}
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${PHOTO_PROJECT}/05_HISTORY
      target: /history/${PROJECT_FOLDER:-示例项目}
      bind:
        create_host_path: false
    networks:
    - photos
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 60s
networks:
  photos:
    driver: bridge
volumes:
  picpeak-data: null
  bridge-data: null
