name: Integrated image
on:
  push:
    paths: ['Dockerfile.integrated', 'docker/integrated/**', 'src/**', 'requirements.lock', '.github/workflows/integrated.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish fixed version to GHCR
permissions:
  contents: read
jobs:
  integrated:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aanlik/picpeak-zh
          ref: ebe9b52fb3c56c39ee9816706892b055da3c87d1
          path: picpeak-source
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: picpeak-source
          file: picpeak-source/Dockerfile.aio
          tags: picpeak-zh:3.134.1-zh.9
          load: true
          cache-from: type=gha,scope=integrated-picpeak
          cache-to: type=gha,mode=max,scope=integrated-picpeak
      - name: Combine independent services
        run: docker build -f Dockerfile.integrated -t picpeak-pixcake:3.134.1-zh.9-bridge.0.1.2 .
      - name: Actual container smoke and restart
        run: ./docker/integrated/smoke.sh
      - name: Publish versioned package
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          tag="ghcr.io/$owner/picpeak-pixcake:3.134.1-zh.9-bridge.0.1.2"
          docker tag picpeak-pixcake:3.134.1-zh.9-bridge.0.1.2 "$tag"
          docker push "$tag"
